name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node --test
      - run: node --check watchdog.mjs && bash -n install.sh && bash -n uninstall.sh && bash -n scripts/orca-setup.sh
      # plutil is macOS-only; the runner is Linux, so validate the launchd plist with plistlib.
      - run: python3 -c "import plistlib; plistlib.load(open('com.john.orca-limit-watchdog.plist','rb'))"
